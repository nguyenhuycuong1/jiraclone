spring:
  application:
    name: jira-clone-app
  datasource:
    url: jdbc:postgresql://localhost:5432/jiraclone
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
            max-wait: -1ms
  messages:
    basename: messages
    encoding: UTF-8
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  security:
    jwt:
      # Base64-encoded secret (min 256 bits). Override via JWT_SECRET env var in production.
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbg==}
      expiration: 900000 # 15m in milliseconds
    cookie:
      secure: false # set true in production (requires HTTPS)
    token-cleanup:
      cron: "0 0 3 * * *" # 3 AM every day

logging:
  level:
    com.jiraclone: DEBUG
    org.springframework.security: INFO
